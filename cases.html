<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMI中国 · 案例库 | AI项目管理社区</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  --deep-navy: #0a0e1a;
  --navy-mid: #0d1b2a;
  --pmi-blue: #003DA5;
  --gold: #c9a961;
  --gold-light: #e8d5a0;
  --cyan: #00f5d4;
  --text-primary: #ffffff;
  --text-secondary: #8892a4;
  --glass-bg: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(255, 255, 255, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--deep-navy);
  color: var(--text-primary);
  overflow-x: hidden;
  line-height: 1.6;
}

.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 1rem 2rem;
  background: transparent;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.navbar.scrolled {
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
}

.nav-container {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 1.15em;
  text-decoration: none;
  color: var(--text-primary);
}

.logo-mark { width: 48px; height: 48px; position: relative; display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 100%; height: 100%; }
.logo-text {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  display: flex;
  align-items: baseline;
  gap: 2px;
}

.logo-text .ai { color: #FF6F00; } /* 活力橙 */
.logo-text .pm { color: #00C1DE; } /* 专业青 */
.logo-text .cube {
  color: #8B5CF6; /* 智慧紫 */
  font-size: 1rem;
  font-weight: 700;
  vertical-align: super;
  position: relative;
  top: -0.4em;
}
.logo-text .sub {
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  margin-left: 8px;
  padding-left: 8px;
  border-left: 1px solid var(--glass-border);
}


.nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }
.nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s; position: relative; }
.nav-links a:hover { color: var(--text-primary); }
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--cyan));
  transition: width 0.3s;
}
.nav-links a:hover::after { width: 100%; }

.nav-cta {
  padding: 0.75rem 1.5rem;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: var(--deep-navy) !important;
  border-radius: 50px;
  font-weight: 700;
  transition: all 0.3s;
}
.nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(201, 169, 7, 0.4); }
.nav-cta::after { display: none !important; }

.page-header {
  padding: 8rem 2rem 3rem;
  text-align: center;
  background: linear-gradient(180deg, rgba(0, 61, 165, 0.2) 0%, transparent 100%);
}

.page-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.page-header p { color: var(--text-secondary); font-size: 1.2rem; max-width: 600px; margin: 0 auto; }

.stats-bar { display: flex; justify-content: center; gap: 4rem; padding: 2rem; background: var(--glass-bg); border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }
.stat-item { text-align: center; }
.stat-item b { display: block; font-size: 2.5rem; font-family: 'Space Grotesk', sans-serif; color: var(--gold); }
.stat-item span { font-size: 0.9rem; color: var(--text-secondary); }

.content { max-width: 1200px; margin: 0 auto; padding: 2rem; }

.search-box {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 2rem;
}

.search-box input {
  width: 100%;
  padding: 1rem 1.5rem;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  font-size: 1rem;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-primary);
  transition: all 0.3s;
}

.search-box input:focus { outline: none; border-color: var(--gold); background: rgba(255, 255, 255, 0.08); }
.search-box input::placeholder { color: var(--text-secondary); }

.industry-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 2rem; }
.industry-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 1.5rem;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
}
.industry-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
.industry-card.active { border-color: var(--gold); background: rgba(201, 169, 7, 0.1); }
.industry-card h3 { margin: 0 0 8px; font-size: 1rem; color: var(--text-primary); }
.industry-card p { margin: 0; font-size: 0.85rem; color: var(--text-secondary); }

.case-list { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.5rem; min-height: 200px; }
.case-item { padding: 1rem 0; border-bottom: 1px solid var(--glass-border); cursor: pointer; transition: all 0.3s; }
.case-item:last-child { border-bottom: none; }
.case-item:hover { background: rgba(201, 169, 7, 0.05); padding-left: 1rem; }
.case-item h4 { margin: 0 0 4px; font-size: 1rem; color: var(--text-primary); }
.case-item p { margin: 0; font-size: 0.85rem; color: var(--text-secondary); }

.loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
.section-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--gold); }

.footer { background: var(--navy-mid); border-top: 1px solid var(--glass-border); padding: 3rem 2rem; text-align: center; }
.footer-content { max-width: 1200px; margin: 0 auto; }
.footer-links { display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
.footer-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.3s; }
.footer-links a:hover { color: var(--gold); }
.footer-copy { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; }
.footer-filing { color: var(--text-secondary); font-size: 0.8rem; }
.footer-filing a { color: var(--text-secondary); text-decoration: none; }
.footer-filing a:hover { color: var(--gold); }

@media (max-width: 768px) {
  .nav-links { display: none; }
  .page-header h1 { font-size: 2rem; }
  .stats-bar { flex-direction: column; gap: 1.5rem; }
  .industry-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="/" class="nav-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 左上 - 活力橙 -->
          <rect x="10" y="10" width="35" height="35" rx="6" fill="#FF6F00"/>
          <!-- 右上 - 专业青 -->
          <rect x="55" y="10" width="35" height="35" rx="6" fill="#00C1DE"/>
          <!-- 左下 - 智慧紫 -->
          <rect x="10" y="55" width="35" height="35" rx="6" fill="#8B5CF6"/>
          <!-- 右下 - 生态绿 -->
          <rect x="55" y="55" width="35" height="35" rx="6" fill="#00E5A0"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="ai">AI</span><span class="pm">PM</span><span class="cube">³</span>
        <span class="sub">PMI中国AI项目管理社区</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="/">首页</a></li>
      <li><a href="https://www.twzx.bj.cn/cases.html" target="_blank">行业案例库</a></li>
      <li><a href="/agents.html">智能体能力</a></li>
      <li><a href="/knowledge.html">知识库</a></li>
      <li><a href="/ai-assist.html">AI问答助手</a></li>
      <li><a href="/join.html">加入社区</a></li>
      <li><a href="https://aipm.pmi.bj.cn" class="nav-cta" target="_blank">进入系统 →</a></li>
    </ul>
  </div>
</nav>

<div class="page-header">
  <h1>📊 案例库</h1>
  <p>1,414个真实行业案例，覆盖14个行业领域</p>
</div>

<div class="stats-bar">
  <div class="stat-item"><b id="totalCases">-</b><span>总案例数</span></div>
  <div class="stat-item"><b id="totalIndustries">-</b><span>行业分类</span></div>
</div>

<div class="content">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索案例名称...">
  </div>
  <h3 class="section-title">按行业筛选</h3>
  <div class="industry-grid" id="industryGrid"></div>
  <h3 class="section-title" id="currentIndustry">全部案例</h3>
  <div class="case-list" id="caseList">
    <div class="loading">加载中...</div>
  </div>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-links">
      <a href="/">首页</a>
      <a href="https://www.twzx.bj.cn/cases.html" target="_blank">行业案例库</a>
      <a href="/agents.html">智能体能力</a>
      <a href="/knowledge.html">知识库</a>
      <a href="/ai-assist.html">AI问答助手</a>
      <a href="/join.html">加入社区</a>
    </div>
    <div class="footer-copy">© 2026 PMI中国·AI项目管理社区 | 运营主体：北京通维管理咨询有限公司</div>
    <div class="footer-filing">
      <a href="https://beian.miit.gov.cn/" target="_blank">京ICP备2025132411号-3</a>
      &nbsp;|&nbsp;
      <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=11010502061159" target="_blank">京公网安备11010502061159号</a>
    </div>
  </div>
</footer>

<script>
let allCases = [];
let industries = [];
let currentFilter = null;

fetch('/api/cases')
  .then(r => r.json())
  .then(data => {
    document.getElementById('totalCases').textContent = data.total;
    document.getElementById('totalIndustries').textContent = data.industries.length;
    industries = data.industries;
    renderIndustryGrid();
    loadAllCases();
  });

function renderIndustryGrid() {
  const grid = document.getElementById('industryGrid');
  let html = '<div class="industry-card active" onclick="filterIndustry(null)"><h3>全部行业</h3><p>' + industries.length + ' 个分类</p></div>';
  industries.forEach(ind => {
    const name = ind.replace(/^M\d+_/,'');
    html += '<div class="industry-card" onclick="filterIndustry(\\'' + ind + '\\')"><h3>' + name + '</h3><p>查看案例 →</p></div>';
  });
  grid.innerHTML = html;
}

async function loadAllCases() {
  const resp = await fetch('/api/cases');
  const data = await resp.json();
  allCases = [];
  Object.entries(data.industries).forEach(([ind, cases]) => {
    cases.forEach(c => allCases.push({ name: c, industry: ind }));
  });
  renderCases(allCases, '全部案例');
}

function filterIndustry(industry) {
  currentFilter = industry;
  document.querySelectorAll('.industry-card').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const nameEl = document.getElementById('currentIndustry');
  if (!industry) {
    nameEl.textContent = '全部案例';
    renderCases(allCases);
  } else {
    const name = industry.replace(/^M\d+_/,'');
    nameEl.textContent = name + '（' + allCases.filter(c => c.industry === industry).length + '个）';
    renderCases(allCases.filter(c => c.industry === industry), name);
  }
}

function renderCases(cases, title) {
  const list = document.getElementById('caseList');
  if (!cases || cases.length === 0) {
    list.innerHTML = '<div class="loading">暂无案例</div>';
    return;
  }
  list.innerHTML = cases.slice(0, 100).map(c => '<div class="case-item"><h4>' + c.name + '</h4><p>' + c.industry.replace(/^M\d+_/,'') + '</p></div>').join('');
  if (cases.length > 100) list.innerHTML += '<div class="loading">还有 ' + (cases.length - 100) + ' 个案例，请筛选查看</div>';
}

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (!q) { renderCases(allCases); return; }
  const filtered = allCases.filter(c => c.name.toLowerCase().includes(q));
  renderCases(filtered, '搜索「' + e.target.value + '」');
});

window.addEventListener('scroll', () => {
  const navbar = document.getElementById('navbar');
  if (window.scrollY > 50) navbar.classList.add('scrolled');
  else navbar.classList.remove('scrolled');
});
</script>
</body>
</html>
